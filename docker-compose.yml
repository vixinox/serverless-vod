services:
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    build:
      context: .
      dockerfile: Dockerfile.localstack
      args:
        APT_MIRROR: ${APT_MIRROR}
    pull_policy: never
    container_name: localstack
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "4566:4566"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: "1"
      SNAPSHOT_SAVE_STRATEGY: SCHEDULED
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "30"
      SERVICES: s3,stepfunctions,lambda,iam,events
      LAMBDA_DOCKER_FLAGS: -v localstack_data:/var/lib/localstack --add-host=host.docker.internal:host-gateway
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./node_modules:/opt/node_modules"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
    name: postgres_data
  localstack_data:
    name: localstack_data